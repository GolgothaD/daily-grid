<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>The Daily Grid</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%231b1a17%22/%3E%3Crect x=%222%22 y=%222%22 width=%225%22 height=%225%22 fill=%22%23fff%22/%3E%3Crect x=%229%22 y=%229%22 width=%225%22 height=%225%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="picker" class="screen">
  <header class="mast">
    <div class="mast-top"><span id="today"></span><button id="themeBtn" class="icon" aria-label="Toggle dark mode">◐</button></div>
    <h1>The Daily Grid</h1>
    <div class="mast-sub">Crosswords for the stubbornly clever</div>
  </header>
  <nav id="tiers" class="tiers" role="tablist"><button data-t="Easy" role="tab">Easy</button><button data-t="Medium" role="tab">Medium</button><button data-t="Hard" role="tab">Hard</button></nav>
  <div id="tierNote" class="tiernote"></div>
  <ul id="plist"></ul>
  <footer class="foot">Progress saves automatically on this device.</footer>
</div>

<div id="solver" class="screen hidden">
  <div class="bar">
    <button id="backBtn" class="icon" aria-label="Back">‹</button>
    <div class="ptitle"><b id="sTitle"></b><small id="sDiff"></small></div>
    <button id="timer" class="timer" aria-label="Pause">0:00</button>
    <button id="menuBtn" class="icon" aria-label="Menu">⋯</button>
  </div>
  <div id="menu" class="menu hidden">
    <div class="mrow"><span>Check</span><button data-a="check-letter">Letter</button><button data-a="check-word">Word</button><button data-a="check-puzzle">Puzzle</button></div>
    <div class="mrow"><span>Reveal</span><button data-a="reveal-letter">Letter</button><button data-a="reveal-word">Word</button><button data-a="reveal-puzzle">Puzzle</button></div>
    <div class="mrow"><span>More</span><button data-a="clear">Clear all</button><button data-a="theme">Dark mode</button></div>
  </div>
  <div class="gridwrap"><div id="grid"></div>
    <div id="paused" class="paused hidden"><div><p>Paused</p><button id="resumeBtn" class="primary">Resume</button></div></div>
  </div>
  <div class="tabs"><button id="tabA" class="on">Across</button><button id="tabD">Down</button></div>
  <ol id="clist"></ol>
  <div class="dock">
    <div class="cluebar"><button id="prevClue" class="arrow" aria-label="Previous clue">‹</button><div id="clueText"><b id="clueNum"></b> <span id="clueStr"></span></div><button id="nextClue" class="arrow" aria-label="Next clue">›</button></div>
    <div id="kb" class="kb"></div>
  </div>
</div>

<div id="done" class="overlay hidden">
  <canvas id="confetti"></canvas>
  <div class="card">
    <div class="stamp">SOLVED</div>
    <h2 id="doneTitle"></h2>
    <p id="doneStats"></p>
    <div class="row"><button id="doneView">View grid</button><button id="doneNext" class="primary">Next puzzle</button></div>
  </div>
</div>
<script src="puzzles.js"></script>
<script src="app.js"></script>
</body></html>
